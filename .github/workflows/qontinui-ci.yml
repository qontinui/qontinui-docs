name: qontinui CI

# The workflow name is the check context coord's merge engine reads. Keep it
# stable ("qontinui CI") — renaming it orphans the recorded CI baseline.

# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3). coord also judges "can this repo produce candidate CI?" purely on
# the PRESENCE of this `push:` key (`ci_baseline.rs`
# `is_candidate_check_producing_trigger` is branch-filter-blind by design), so
# deleting it trips AlertKind::MergeCandidateNoCiProducer.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `main` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch.
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran this
# workflow TWICE against the same head SHA - two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. A `concurrency:`
# block does NOT fix it: `github.ref` differs by event (`refs/heads/<branch>` vs
# `refs/pull/<n>/merge`) so the two runs land in different groups - measured,
# this file and qontinui-gym's both carried `cancel-in-progress: true` when that
# was measured, and still emitted both runs at one SHA. No note about what the
# sibling carries TODAY follows, deliberately. The one that used to sit here
# said qontinui-gym "still carries the unguarded flag"; qontinui-gym#6 took the
# guard on 2026-09-02, so the note was false roughly two days after it was
# written, in a comment nobody re-reads until they are already mid-edit. The
# measurement above is a record and does not rot; a live-state claim about
# another repo does. Plan:
# 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI.
on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:

# NEVER set `cancel-in-progress: true` unconditionally here. Scoping the `push:`
# trigger above left `main` and `merge-candidate*` as the ONLY branches a push
# run can fire on, so blanket cancellation no longer sheds redundant work - it
# sheds runs on the two ref classes coord's merge engine reads.
#
#   - `main`. The group is shared by every push to the default branch, so a
#     second land while the first one's run is still going cancels that run. The
#     window is 70 s wide (run 33365400260, a post-merge main run:
#     06:44:16Z -> 06:45:26Z) and the train lands back-to-back with
#     COORD_MERGE_SLOTS=3, so this is reachable rather than theoretical.
#
#     Be honest about the size of it: every tree the train lands has already
#     been built green before it lands - by candidate CI, or, when the rebase is
#     a proven no-op, by the PR's own run - so the verdict a cancel destroys
#     here is a redundant one, not a unique one. What makes it worth
#     closing anyway is that it is destroyed SILENTLY - `ci_baseline.rs`
#     `ingest_workflow_run` returns before the write when
#     `is_supersession_conclusion` matches (`cancelled` | `stale`), a guard
#     added after the 2026-06-18 qontinui-coord wedge, so the baseline quietly
#     keeps its last conclusive verdict instead.
#
#     Do not read that guard as permission to cancel. It is a downstream
#     compensation, living in one consumer, on whatever coord build happens to
#     be running; the invariant belongs at the producer, which is this file.
#
#   - `merge-candidate*`. The train mints `merge-candidate/<proposal_id>` from
#     the proposal id and a requeue re-queues the SAME proposal row
#     (`merge_scheduler.rs` `revert_claim_to_queued` / `on_base_mismatch`), so
#     the same ref is pushed again. The candidate verdict is head_sha scoped and
#     a requeue re-rebases onto a moved main, so a cancelled older run is not
#     misread as the new attempt's answer - the cost is the wasted run and the
#     requeue churn, not a wrong verdict.
#
# The expression below is already in production on the repos that hit this
# first: `qontinui-coord/ci.yml`, `qontinui-schemas/ts-typecheck.yml` and
# `qontinui-schemas/schema-drift.yml` all carry it byte-identically. coord also
# keys its GROUP by `github.event_name`; that is unnecessary here only because
# this workflow has no `workflow_dispatch:` trigger (dispatch and push would
# share `refs/heads/main`). Add one and key the group by `github.event_name` too.
#
# It keeps the one thing this block is worth having - superseding a PR's own
# earlier run when that PR is pushed again. Safe, because coord reads PR checks
# through the `coord.pr_check_runs_latest` view, partitioned by
# `(repo, head_sha, name)`: the superseded attempt sits in a different partition
# and is never consulted for the new head.
#
# Note this only stops an IN-PROGRESS run being killed; GitHub still drops a run
# left PENDING in a group when a newer one queues behind it. That applies to
# `deploy.yml`'s static `pages` group too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Strict `npm ci`, not the bootstrap workflow's `npm ci || npm install`:
      # the fallback turns a lockfile that has drifted from package.json into a
      # silent resolve-from-scratch, so CI stops testing what ships.
      - name: Install dependencies
        run: npm ci

      # The real gate for this repo. `docusaurus build` validates that every
      # sidebar entry resolves to a real doc and — via `onBrokenLinks: "throw"`
      # — that no internal link 404s. Both of those are what had main red:
      # sidebars.js listed 22 doc ids that were never authored.
      - name: Build
        run: npm run build

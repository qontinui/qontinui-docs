name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # Pages is provisioned for this repo as build_type=workflow, serving at
      # https://qontinui.github.io/qontinui-docs/ (must stay in sync with
      # `baseUrl` in docusaurus.config.js).
      #
      # Do NOT add `enablement: true` here. Creating a Pages site is an
      # `administration: write` operation, and that is not among the
      # permissions a workflow can grant GITHUB_TOKEN — the action fails with
      # "Create Pages site failed / HttpError: Resource not accessible by
      # integration" (runs 29927176860 and 29927347005). Provisioning is a
      # one-time repo-settings action, not something this workflow can do.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
